<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat – Athios</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
<script src="{{ url_for('static', filename='js/chat.js') }}" defer></script>
</head>
<body class="chatpage" data-mark="{{ url_for('static', filename='img/mark.png') }}">
<div class="bg" aria-hidden="true"><i style="--b:var(--accent);--p:0;left:-12%;top:-10%"></i><i style="--b:var(--sky);--p:0;right:-14%;top:30%"></i></div>
<div class="app">
 <aside class="side" id="side">
  <div class="side-top">
   <a class="brand" href="/" aria-label="Athios home"><span class="tile"><img src="{{ url_for('static', filename='img/mark.png') }}" alt=""></span>Athios</a>
   <button class="icon only-mobile" id="close" type="button" aria-label="Close chats">✕</button>
  </div>
  <button class="btn pri newchat" id="new" type="button">+ New chat</button>
  <input class="search" id="q" type="search" placeholder="Search chats" aria-label="Search chats" autocomplete="off">
  <ul class="chats" id="chats" aria-label="Your chats"></ul>
  <div class="me"><span class="av2">{{ user.name[0]|upper }}</span><span class="nm">{{ user.name }}</span><a class="lo" href="/logout">Sign out</a></div>
  <div class="side-foot"><a href="/">← Home</a><button id="theme" type="button" data-tip="Light or dark" aria-label="Switch light or dark theme">◐</button></div>
 </aside>
 <section class="pane">
  <div class="top">
   <button class="icon" id="menu" type="button" aria-label="Open chats">☰</button>
   <h1 id="title">New chat</h1>
   <span class="demo">Demo mode</span>
   <button class="icon" id="export" type="button" data-tip="Export chat" aria-label="Export chat"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
   <details class="set">
    <summary data-tip="Reply settings" aria-label="Reply settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></summary>
    <div class="pop">
     <label><span>Creativity <output id="tv">0.7</output></span><input id="temp" type="range" min="0" max="1.5" step="0.1" value="0.7"></label>
     <label><span>Max reply length <output id="lv">200</output></span><input id="len" type="range" min="20" max="400" step="10" value="200"></label>
    </div>
   </details>
  </div>
  <div class="empty" id="empty">
   <span class="tile"><img src="{{ url_for('static', filename='img/mark.png') }}" alt=""></span>
   <h2>Hi {{ user.name.split()[0] }}, how can I help?</h2>
   <div class="chips">
    <button class="chip" type="button" data-p="Explain how a transformer works">Explain how a transformer works</button>
    <button class="chip" type="button" data-p="Show me a code example">Show me a code example</button>
    <button class="chip" type="button" data-p="Help me brainstorm project ideas">Brainstorm project ideas</button>
   </div>
  </div>
  <div class="log" id="log" aria-live="polite" hidden></div>
  <form class="composer" id="form">
   <label class="sr" for="box">Message Athios</label>
   <textarea id="box" rows="1" placeholder="Message Athios" autocomplete="off"></textarea>
   <button class="send" id="go" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </form>
  <p class="hint">Demo mode: replies come from a simple stand-in until the trained Athios model is connected.</p>
 </section>
</div>
</body>
</html>
